services:
  # Full-stack service (Frontend + Backend)
  - type: web
    name: npprajapati
    env: node
    plan: free
    buildCommand: npm install && cd FRONTEND && npm install && npm run build && cd ../BACKEND && npm install
    startCommand: cd BACKEND && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 10000
